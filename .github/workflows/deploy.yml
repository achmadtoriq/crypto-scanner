name: Auto-Deploy to JagoanHosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to JagoanHosting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, ctype, fileinfo, json, openssl, tokenizer, xml

      - name: 📦 Validate Dependencies & Clear Cache
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          php artisan config:clear
          php artisan view:clear

      - name: ⚡ Trigger JagoanHosting cPanel Auto-Pull Webhook
        if: ${{ secrets.CPANEL_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering cPanel Auto-Pull Webhook at JagoanHosting..."
          curl -X GET "${{ secrets.CPANEL_WEBHOOK_URL }}" || true
          echo "✅ Webhook trigger sent! JagoanHosting will pull latest code automatically."
